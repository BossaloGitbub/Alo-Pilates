<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alo pilates — session builder</title>
<style>
  :root {
    --ink: #17140f;
    --ink-soft: #5c564a;
    --paper: #f1ece2;
    --card: #fbf9f5;
    --line: #d9d0bf;
    --clay: #7a4a2e;
    --clay-soft: #f1e3d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 70px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 18px; }

  header {
    border-bottom: 1px solid var(--line);
    padding: 26px 18px 18px;
    margin-bottom: 28px;
  }
  .wordmark {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    margin: 0;
  }
  .wordmark span { color: var(--clay); }
  .tagline {
    margin: 6px 0 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  h2.section-label {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 14px;
  }

  .panel { margin-bottom: 30px; }
  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 0; }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    padding: 11px 12px;
    font-size: 0.98rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    font-family: inherit;
    color: var(--ink);
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .btnrow { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 130px;
    padding: 13px 16px;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    border-radius: 3px;
    border: 1px solid var(--ink);
    cursor: pointer;
    font-family: inherit;
  }
  #generateBtn { background: var(--ink); color: var(--paper); }
  #regenBtn { background: transparent; color: var(--ink); display:none; }
  #printBtn { background: transparent; color: var(--ink-soft); border-color: var(--line); display:none; }
  button:active { opacity: 0.7; }

  .totalbar {
    display:flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--ink);
  }
  .totalbar .meta { font-size: 0.8rem; color: var(--ink-soft); letter-spacing: 0.02em; }
  .totalbar .big { font-size: 1.5rem; font-weight: 600; }

  .segment { margin-bottom: 26px; }
  .segment.focus { border-left: 2px solid var(--clay); padding-left: 14px; margin-left: -16px; }
  .seg-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .seg-head .seg-title { font-size: 1rem; font-weight: 600; }
  .seg-head .seg-num { color: var(--ink-soft); font-weight: 400; margin-right: 6px; }
  .seg-head .tag { font-size: 0.75rem; color: var(--ink-soft); white-space: nowrap; }
  .segment.focus .tag { color: var(--clay); }
  .ex { margin-bottom: 14px; }
  .ex:last-child { margin-bottom: 0; }
  .ex-name { font-weight: 600; margin-bottom: 3px; font-size: 0.95rem; }
  .ex-instruction { font-size: 0.9rem; margin-bottom: 3px; line-height: 1.45; }
  .ex-equip { font-size: 0.83rem; color: var(--ink-soft); margin-bottom: 3px; }
  .ex-ref { font-size: 0.8rem; color: var(--ink-soft); margin-top: 4px; }
  .ex-ref b { color: var(--ink); font-weight: 600; }
  .empty { color: var(--ink-soft); padding: 10px 0 30px; font-size: 0.92rem; }
  .note { font-size: 0.76rem; color: var(--ink-soft); margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); }
  @media print {
    header, .panel, #printBtn { display: none !important; }
    body { background: white; padding: 0; }
    .segment.focus { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="wordmark">alo <span>pilates</span></p>
    <p class="tagline">session builder — 55 minutes, built around you</p>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <h2 class="section-label">Build your session</h2>

    <div class="field">
      <label for="equipment">Equipment</label>
      <select id="equipment">
        <option value="mat">Mat</option>
        <option value="reformer">Reformer</option>
        <option value="chair">Chair</option>
        <option value="cadillac">Cadillac</option>
      </select>
    </div>

    <div class="field">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>

    <div class="field">
      <label for="focus">Focus area (optional)</label>
      <select id="focus">
        <option value="">None — standard full-body session</option>
        <option value="abs_core">Abs / Core</option>
        <option value="core_endurance">Core Endurance</option>
        <option value="leg_strength">Leg Strength</option>
        <option value="coordination_balance">Coordination &amp; Balance</option>
        <option value="back_posture">Back &amp; Posture</option>
        <option value="arms_upper_body">Arms &amp; Upper Body</option>
        <option value="flexibility_mobility">Flexibility &amp; Mobility</option>
      </select>
    </div>

    <div class="btnrow">
      <button id="generateBtn">Generate session</button>
      <button id="regenBtn">Regenerate</button>
      <button id="printBtn">Print / save PDF</button>
    </div>
  </div>

  <div id="output">
    <div class="empty">Choose your options above and generate to build your flow.</div>
  </div>

  <p class="note">alo pilates is a free, self-contained tool — no account, no hosting, no data leaves this page.</p>
</div>

<script>

// Pilates Flow Generator — core engine
// Implements session_settings + focus_mode exactly as defined in pilates-workout-spec.json

function pickN(arr, n) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}

function buildSession(spec, { equipment, difficulty, focusArea }) {
  const segments = spec.segments;
  const focusSegs = focusArea
    ? segments.filter(s => s.focus_tags.includes(focusArea))
    : [];
  const compressible = focusArea
    ? segments.filter(s => !s.always_included && !s.focus_tags.includes(focusArea))
    : [];

  const focusIds = new Set(focusSegs.map(s => s.id));
  const compressIds = new Set(compressible.map(s => s.id));

  // 1. compute durations
  let freed = 0;
  const durations = {};
  for (const seg of segments) {
    if (compressIds.has(seg.id)) {
      const compressed = Math.min(3, seg.duration_minutes);
      freed += seg.duration_minutes - compressed;
      durations[seg.id] = compressed;
    } else {
      durations[seg.id] = seg.duration_minutes; // base, may get extra below
    }
  }

  if (focusArea && focusSegs.length > 0) {
    const baseSum = focusSegs.reduce((a, s) => a + s.duration_minutes, 0);
    let allocated = 0;
    focusSegs.forEach((seg, idx) => {
      let extra;
      if (idx === focusSegs.length - 1) {
        extra = freed - allocated; // give remainder to last one to keep total exact
      } else {
        extra = Math.round((freed * seg.duration_minutes / baseSum) * 10) / 10;
        allocated += extra;
      }
      durations[seg.id] = Math.round((seg.duration_minutes + extra) * 10) / 10;
    });
  }

  // 2. pick exercises per segment
  const out = segments.map(seg => {
    const exCount = compressIds.has(seg.id) ? 2 : 3;
    const chosen = pickN(seg.exercises, exCount).map(ex => ({
      name: ex.name,
      instruction: ex.progressions[difficulty],
      equipment_note: ex.equipment_variations[equipment],
      reference: ex.reference_notes || null,
    }));
    return {
      id: seg.id,
      name: seg.name,
      duration_minutes: durations[seg.id],
      is_focus: focusIds.has(seg.id),
      is_compressed: compressIds.has(seg.id),
      exercises: chosen,
    };
  });

  const total = out.reduce((a, s) => a + s.duration_minutes, 0);
  return { equipment, difficulty, focusArea, total_minutes: Math.round(total * 10) / 10, segments: out };
}



let lastSettings = null;

function render(session) {
  const out = document.getElementById('output');
  const mins = Math.floor(session.total_minutes);
  const secs = Math.round((session.total_minutes - mins) * 60);
  let html = `<div class="totalbar"><span class="meta">${cap(session.equipment)} &middot; ${cap(session.difficulty)}${session.focusArea ? ' &middot; Focus: ' + focusLabel(session.focusArea) : ''}</span><span class="big">${mins} min${secs ? ' ' + secs + ' sec' : ''}</span></div>`;
  session.segments.forEach((seg, i) => {
    const num = String(i + 1).padStart(2, '0');
    html += `<div class="segment ${seg.is_focus ? 'focus' : ''}">`;
    html += `<div class="seg-head"><span class="seg-title"><span class="seg-num">${num}</span>${seg.name}</span><span class="tag">${Math.round(seg.duration_minutes*10)/10} min${seg.is_compressed ? ' &middot; compressed' : ''}${seg.is_focus ? ' &middot; focus' : ''}</span></div>`;
    for (const ex of seg.exercises) {
      html += `<div class="ex">`;
      html += `<div class="ex-name">${ex.name}</div>`;
      html += `<div class="ex-instruction">${ex.instruction}</div>`;
      html += `<div class="ex-equip">${cap(session.equipment)}: ${ex.equipment_note}</div>`;
      if (ex.reference) {
        html += `<div class="ex-ref"><b>Muscles:</b> ${ex.reference.muscles_targeted} &mdash; <b>Cue:</b> &ldquo;${ex.reference.verbal_cue}&rdquo;</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });
  out.innerHTML = html;
  document.getElementById('regenBtn').style.display = 'block';
  document.getElementById('printBtn').style.display = 'block';
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function focusLabel(f) {
  const labels = {
    abs_core: 'Abs / Core', core_endurance: 'Core Endurance', leg_strength: 'Leg Strength',
    coordination_balance: 'Coordination & Balance', back_posture: 'Back & Posture',
    arms_upper_body: 'Arms & Upper Body', flexibility_mobility: 'Flexibility & Mobility'
  };
  return labels[f] || f;
}

document.getElementById('generateBtn').addEventListener('click', () => {
  lastSettings = {
    equipment: document.getElementById('equipment').value,
    difficulty: document.getElementById('difficulty').value,
    focusArea: document.getElementById('focus').value || null,
  };
  render(buildSession(SPEC, lastSettings));
});

document.getElementById('regenBtn').addEventListener('click', () => {
  if (lastSettings) render(buildSession(SPEC, lastSettings));
});

document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>
